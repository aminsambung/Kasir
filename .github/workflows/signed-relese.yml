name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release:
    name: 📦 Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ⚠️ SCRIPT TAMBAHAN UNTUK MEMBUAT IKON OTOMATIS ⚠️
      - name: 🖼️ Generate App Icons from logo.png
        run: |
          # 1. Buat semua folder mipmap
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # 2. Resize logo.png menjadi ic_launcher.png (kotak)
          convert logo.png -resize 48x48     app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 72x72     app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 96x96     app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 144x144   app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 192x192   app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          # 3. Resize logo.png menjadi ic_launcher_round.png (bulat/transparan)
          convert logo.png -resize 48x48 -gravity center -background none -extent 48x48     app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert logo.png -resize 72x72 -gravity center -background none -extent 72x72     app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert logo.png -resize 96x96 -gravity center -background none -extent 96x96     app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert logo.png -resize 144x144 -gravity center -background none -extent 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert logo.png -resize 192x192 -gravity center -background none -extent 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔑 Grant gradlew permission
        run: chmod +x ./gradlew

      - name: 📦 Build Release APK (Split ABI)
        run: ./gradlew assembleRelease --stacktrace

      - name: 📤 Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 30

      - name: 📤 Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          retention-days: 30

      - name: 📊 Build Summary
        run: |
          echo "## 🎉 Release APK Built!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/release/ || true
